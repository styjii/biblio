{# Barre d'outils de l'éditeur ; `links` : liens « Lire » et « Aperçu ». #}
<button id='btn-vim' class='pill on' type='button'>Vim</button>
<button id='wrap-btn' class='pill' type='button'>Retour ligne</button>
<button id='num-btn' class='pill' type='button'>Numéros</button>
<button id='btn-keys' class='pill' type='button'>{{ icon keyboard 16 }}Touches</button>
<button id='fs-down' class='pill' type='button' aria-label='Texte plus petit'>A{{ icon minus 12 }}</button>
<button id='fs-up' class='pill' type='button' aria-label='Texte plus grand'>A{{ icon plus 12 }}</button>
{{ links }}
