{# Barre d'outils de l'aperçu Markdown ; `links` : « Source » et « Éditer » (ou son état verrouillé). #}
<button id='md-toc-btn' class='pill on' type='button'>{{ icon list 16 }}Sommaire</button>
<button id='md-fs-down' class='pill' type='button' aria-label='Texte plus petit'>A{{ icon minus 12 }}</button>
<button id='md-fs-up' class='pill' type='button' aria-label='Texte plus grand'>A{{ icon plus 12 }}</button>

<button id='md-print' class='pill' type='button'>{{ icon printer 16 }}Imprimer</button>
