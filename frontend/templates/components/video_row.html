<a class='row{{ cur }}' href='/watch?f={{ q }}' data-f='{{ q }}' data-key='{{ key }}'>
<div class='rthumb'>
<span class='ph'>{{ icon film 24 }}</span>
<img loading='lazy' alt='' src='/thumb?f={{ q }}' onerror='this.remove()'>
<span class='dur' hidden></span><span class='bar' hidden><i></i></span>
</div>
<div class='rinfo'><div class='rname'>{{ name }}</div><div class='rsub'>{{ sub }}</div></div>
</a>
