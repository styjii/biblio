{# Fichier fréquent : ouvre le dossier d'entrée du fichier puis le fichier. #}
<a class='item' href='{{ href }}' title='{{ title }}'>
  <span class='ico {{ cls }}'>{{ icon_svg }}</span>
  <span class='text'>
    <span class='name'>{{ name }}</span>
    <div class='sub'>{{ where }} · {{ count }}</div>
  </span>
  <span class='go'>{{ icon chevron 18 }}</span>
</a>
