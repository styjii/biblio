{# Lecteur local : le fichier choisi ou déposé est lu par le navigateur (URL locale), sans passer par le serveur. #}
<div class='mp' id='mp'>
  <div class='mp-stage' id='mp-stage'>
    <video id='mp-video' controls playsinline preload='metadata' hidden></video>
    <div class='mp-audio' id='mp-audio-box' hidden>
      <span class='ico media'>{{ icon music 30 }}</span>
      <div class='mp-audio-title' id='mp-audio-title'></div>
      <audio id='mp-audio' controls preload='metadata'></audio>
    </div>
    <div class='mp-drop' id='mp-drop' role='button' tabindex='0' aria-label='Choisir ou déposer un fichier vidéo ou audio'>
      <span class='ico media'>{{ icon upload 26 }}</span>
      <div class='mp-drop-title'>Glisse une vidéo ou un son ici</div>
      <div class='sub'>ou</div>
      <button type='button' class='pill primary' id='mp-pick'>{{ icon play 16 }}Choisir des fichiers</button>
      <div class='sub'>Lecture directe depuis cet appareil : rien n'est copié ni envoyé au serveur.</div>
    </div>
  </div>
  <div class='mp-bar' id='mp-bar' hidden>
    <div class='mp-now' id='mp-now'></div>
    <div class='mp-actions'>
      <button type='button' class='pill sm' id='mp-prev' title='Précédent'>{{ icon prev 16 }}Précédent</button>
      <button type='button' class='pill sm' id='mp-next' title='Suivant'>{{ icon next 16 }}Suivant</button>
      <button type='button' class='pill sm' id='mp-add' title='Ajouter des fichiers'>{{ icon plus 16 }}Ajouter</button>
      <button type='button' class='pill sm' id='mp-clear' title='Vider la liste'>{{ icon close 16 }}Vider</button>
    </div>
  </div>
  <div class='mp-error' id='mp-error' role='alert' hidden></div>
  <div class='mp-list' id='mp-list' hidden></div>
  <input type='file' id='mp-input' accept='video/*,audio/*,.mkv,.mka,.flac,.m4a,.opus,.ogg,.oga,.wav,.avi,.mov,.ts' multiple hidden>
</div>
